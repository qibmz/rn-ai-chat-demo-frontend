name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本跟 package.json#packageManager，勿再写死 version（会与 10.x 冲突）

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              pnpm exec commitlint --from HEAD~1 --to HEAD --verbose || pnpm exec commitlint --last --verbose
            else
              pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
            fi
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本跟 package.json#packageManager，勿再写死 version（会与 10.x 冲突）

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # typecheck currently fails on gluestack UI kit typings; keep `pnpm typecheck` local-only for now

      - name: Build (web)
        run: pnpm run build
